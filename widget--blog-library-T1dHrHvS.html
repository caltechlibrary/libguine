<div id="blog-library-T1dHrHvS" aria-live="polite"></div>
<!-- learned from https://stackoverflow.com/a/66625405 -->
<script>
  async function fetchBlogPosts() {
    try {
      let response = await fetch('https://caltechlibrary.github.io/libguine/blog/library.html');
      document.getElementById('blog-library-T1dHrHvS').innerHTML = await response.text();
    } catch (e) {
      console.log('fetchBlogPosts error:' + e);
    }
  }
  fetchBlogPosts();
</script>
